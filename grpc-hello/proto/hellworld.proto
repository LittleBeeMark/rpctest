syntax = "proto3";


package helloworld;


option go_package = "rpctest/grpc-hello/proto;proto";


message HelloRequest {
  string name = 1;
}


message HelloReply {
  string message = 1;
}


service Greeter {
  // Unary RPC
  rpc SayHello (HelloRequest) returns (HelloReply){}
  // Server streaming RPC
}